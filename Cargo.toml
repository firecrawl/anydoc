[workspace]
members = ["node", "python", "wasm"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[package]
name = "anydoc"
version = "0.1.4"
edition = "2024"
# Edition 2024 needs 1.85; zip and calamine both raise it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE"]

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[dependencies]
calamine = { version = "0.36.1", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "0.1.7"
quick-xml = "0.41.0"

# `zip` is split by target so that only the wasm32 build gives anything up.
#
# One default codec blocks wasm32: `zstd` compiles a bundled C library through
# cc-rs, and clang has no wasm32 target for it. Every other default codec is pure
# Rust and builds fine. Dropping them all for every target would also remove them
# from the native, Node, and Python builds, so this narrows the loss to wasm.
#
# No packaging format anydoc reads (OOXML, ODF, epub) stores entries with zstd, so
# the wasm build loses no supported input.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = "8.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "8.6.0", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "ppmd",
    "time",
    "xz",
] }

[profile.release]
lto = "thin"
strip = "symbols"
