[package]
name = "anydoc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anydoc = { path = ".." }
cfb = "0.14.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

