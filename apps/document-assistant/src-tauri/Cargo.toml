[package]
name = "anydoc-assistant"
version = "0.1.0"
description = "Local-first document understanding built on AnyDoc"
authors = ["AnyDoc Assistant contributors"]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace]

[lib]
name = "anydoc_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "4.1", default-features = false, features = ["v1", "windows-native-keyring-store"] }
pdfium-render = "0.9.3"
rusqlite = { version = "0.37", features = ["bundled-full"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"
