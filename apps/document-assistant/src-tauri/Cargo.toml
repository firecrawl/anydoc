[package]
name = "anydoc-assistant"
version = "0.1.0"
description = "Local-first document understanding built on AnyDoc"
authors = ["AnyDoc Assistant contributors"]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace]

[lib]
name = "anydoc_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
